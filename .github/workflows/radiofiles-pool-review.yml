name: Riley & Coe RadioFiles artist-pool review

on:
  schedule:
    - cron: "20 8 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/collect_radiofiles.py"
      - "scripts/compare_radiofiles_artist_pool.py"
      - "data/artist_pool.csv"
      - "config/artist_aliases.csv"
      - ".github/workflows/radiofiles-pool-review.yml"
  push:
    paths:
      - "scripts/collect_radiofiles.py"
      - "scripts/compare_radiofiles_artist_pool.py"
      - "data/artist_pool.csv"
      - "config/artist_aliases.csv"
      - ".github/workflows/radiofiles-pool-review.yml"

permissions:
  contents: read

jobs:
  collect-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect recent public RadioFiles candidates
        run: |
          mkdir -p artifacts/radiofiles-review
          SINCE=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=13)).isoformat())")
          UNTIL=$(python -c "from datetime import date; print(date.today().isoformat())")
          python scripts/collect_radiofiles.py --since "$SINCE" --until "$UNTIL" --out-dir artifacts/radiofiles-review/collection
      - name: Compare candidate artists with authoritative pool (review only)
        if: always()
        run: |
          if test -f artifacts/radiofiles-review/collection/radiofiles_track_candidates.csv; then
            python scripts/compare_radiofiles_artist_pool.py \
              --pool data/artist_pool.csv \
              --candidates artifacts/radiofiles-review/collection/radiofiles_track_candidates.csv \
              --aliases config/artist_aliases.csv \
              --out-dir artifacts/radiofiles-review/comparison
          else
            echo "Collector did not produce candidates; comparison intentionally not run."
          fi
      - name: Preserve collection and pool comparison, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-radiofiles-pool-review-${{ github.run_id }}
          path: artifacts/radiofiles-review/
          if-no-files-found: warn
          retention-days: 30
