name: Weekly hybrid Riley & Coe Gig Search

on:
  push:
    branches:
      - hybrid-gig-research
    paths:
      - '.github/workflows/weekly-hybrid-gig-search.yml'
      - 'config/definitive_venues.csv'
      - 'config/hybrid_venue_sources.csv'
      - 'config/hybrid_secondary_sources.csv'
      - 'scripts/discover_event_candidates.py'
      - 'scripts/inspect_event_links.py'
      - 'scripts/match_pool_to_window_events.py'
      - 'scripts/verify_event_candidates.py'
      - 'scripts/validate_hybrid_baseline.py'
      - 'scripts/check_known_gig_regressions.py'
      - 'scripts/verify_event_candidates.py'
      - 'data/artist_pool.csv'
      - 'tests/fixtures/known_gig_regressions.csv'
      - 'tests/test_inspect_event_links.py'
      - 'tests/test_check_known_gig_regressions.py'
      - 'tests/test_verify_event_candidates.py'
      - 'tests/test_event_inspection_structured_fallback.py'
      - 'tests/test_verify_event_candidates.py'
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-hybrid-riley-coe-gig-search-14-day
  cancel-in-progress: true

jobs:
  hybrid-search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hybrid-gig-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests and validate both source registries
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_hybrid_baseline.py

      - name: Set dated 14-day window and create output directory
        id: window
        shell: bash
        run: |
          set -euo pipefail
          START="$(python -c 'from datetime import date; print(date.today().isoformat())')"
          END="$(python -c 'from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())')"
          POOL_ROWS="$(python -c 'import csv; f=open("data/artist_pool.csv",encoding="utf-8-sig",newline=""); print(sum(1 for _ in csv.DictReader(f)))')"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "pool_rows=$POOL_ROWS" >> "$GITHUB_OUTPUT"
          mkdir -p "artifacts/hybrid-search-$START"
          echo "Search window: $START to $END (14 calendar days)." >> "$GITHUB_STEP_SUMMARY"
          echo "Artist pool: $POOL_ROWS rows; read-only during gig search." >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage passes: 18 primary source rows + 18 independent secondary calendar rows." >> "$GITHUB_STEP_SUMMARY"

      - name: Discover primary venue calendars and event links
        if: success()
        shell: bash
        run: |
          set +e
          python scripts/discover_event_candidates.py \
            --sources config/hybrid_venue_sources.csv \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --out-dir "artifacts/hybrid-search-${{ steps.window.outputs.start }}/primary-discovery"
          echo "Primary discovery exit code: $?"

      - name: Discover independent secondary venue calendars and event links
        if: success()
        shell: bash
        run: |
          set +e
          python scripts/discover_event_candidates.py \
            --sources config/hybrid_secondary_sources.csv \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --out-dir "artifacts/hybrid-search-${{ steps.window.outputs.start }}/secondary-discovery"
          echo "Secondary discovery exit code: $?"

      - name: Inspect primary and secondary event pages
        if: success()
        shell: bash
        run: |
          set +e
          OUT="artifacts/hybrid-search-${{ steps.window.outputs.start }}"
          for PASS in primary secondary; do
            SOURCES="config/hybrid_venue_sources.csv"
            [ "$PASS" = "secondary" ] && SOURCES="config/hybrid_secondary_sources.csv"
            LINKS="$OUT/$PASS-discovery/event_link_candidates.csv"
            [ -f "$LINKS" ] || { mkdir -p "$OUT/$PASS-discovery"; printf 'venue,link_text,candidate_url,source_page_url,candidate_reason,verified,notes\n' > "$LINKS"; }
            python scripts/inspect_event_links.py \
              --links "$LINKS" \
              --sources "$SOURCES" \
              --extra-seeds tests/fixtures/known_gig_regressions.csv \
              --out-dir "$OUT/$PASS-inspection" \
              --start "${{ steps.window.outputs.start }}" \
              --end "${{ steps.window.outputs.end }}" \
              --max-pages-per-venue 35 --max-depth 2
            echo "$PASS inspection exit code: $?"
          done

      - name: Combine both passes and snapshot evidence
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import csv, shutil
          from pathlib import Path
          root = Path("artifacts/hybrid-search-${{ steps.window.outputs.start }}")
          combined = root / "combined"
          combined.mkdir(parents=True, exist_ok=True)
          def read(path):
              if not path.exists(): return []
              with path.open(encoding="utf-8-sig", newline="") as f: return list(csv.DictReader(f))
          def write(path, rows, fields):
              with path.open("w", encoding="utf-8", newline="") as f:
                  w=csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  w.writerows(rows)
          event_fields=["event_date","venue","event_title","artist","artist_role","source_url","verified","price","ticket_status","discovery_method","notes"]
          inspected_fields=["venue","page_url","http_status","content_type","page_title","event_title","event_date","performer_names","price","currency","availability","event_jsonld_found","visible_text_snapshot","verified","status","notes"]
          link_fields=["venue","link_text","candidate_url","source_page_url","candidate_reason","verified","notes"]
          all_events=[]
          all_links=[]
          all_inspected=[]
          for pass_name in ("primary","secondary"):
              event_path=root/f"{pass_name}-discovery/event_candidates.csv"
              for row in read(event_path):
                  row["notes"] = f"[{pass_name}] " + (row.get("notes") or "")
                  all_events.append(row)
              for row in read(root/f"{pass_name}-discovery/event_link_candidates.csv"):
                  row["notes"] = f"[{pass_name}] " + (row.get("notes") or "")
                  all_links.append(row)
              inspection_dir=root/f"{pass_name}-inspection"
              for row in read(inspection_dir/"event_page_inspection.csv"):
                  rel=(row.get("visible_text_snapshot") or "").strip()
                  if rel:
                      src=inspection_dir/rel
                      if src.is_file():
                          target_dir=combined/"snapshots"
                          target_dir.mkdir(parents=True, exist_ok=True)
                          target=target_dir/src.name
                          if target.exists() and target.read_bytes()!=src.read_bytes():
                              target=target_dir/f"{pass_name}-{src.name}"
                          shutil.copy2(src,target)
                          row["visible_text_snapshot"]="snapshots/"+target.name
                  row["notes"] = f"[{pass_name}] " + (row.get("notes") or "")
                  all_inspected.append(row)
          write(combined/"event_candidates.csv", all_events, event_fields)
          write(combined/"event_link_candidates.csv", all_links, link_fields)
          write(combined/"event_page_inspection.csv", all_inspected, inspected_fields)
          print(f"Combined discovery event rows: {len(all_events)}")
          print(f"Combined inspected event/page rows: {len(all_inspected)}")
          print(f"Combined text snapshots: {len(list((combined/'snapshots').glob('*.txt')))}")
          PY

      - name: Match the entire preserved artist pool against both source passes
        if: success()
        shell: bash
        run: |
          set +e
          OUT="artifacts/hybrid-search-${{ steps.window.outputs.start }}"
          EVENTS="$OUT/combined/event_candidates.csv"
          INSPECTED="$OUT/combined/event_page_inspection.csv"
          [ -f "$EVENTS" ] || printf 'event_date,venue,event_title,artist,artist_role,source_url,verified,price,ticket_status,discovery_method,notes\n' > "$EVENTS"
          [ -f "$INSPECTED" ] || printf 'venue,page_url,http_status,content_type,page_title,event_title,event_date,performer_names,price,currency,availability,event_jsonld_found,visible_text_snapshot,verified,status,notes\n' > "$INSPECTED"
          python scripts/match_pool_to_window_events.py \
            --pool data/artist_pool.csv \
            --events "$EVENTS" \
            --inspected "$INSPECTED" \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --out "$OUT/artist_window_event_matches.csv"
          echo "Pool matching exit code: $?"

      - name: Check the five known-gig regressions against both source passes
        if: success()
        shell: bash
        run: |
          set +e
          OUT="artifacts/hybrid-search-${{ steps.window.outputs.start }}"
          python scripts/check_known_gig_regressions.py \
            --fixtures tests/fixtures/known_gig_regressions.csv \
            --events "$OUT/combined/event_candidates.csv" \
            --inspected "$OUT/combined/event_page_inspection.csv" \
            --inspection-dir "$OUT/combined" \
            --natural-links "$OUT/combined/event_link_candidates.csv" \
            --out "$OUT/known_gig_regressions.csv"
          echo "Regression check exit code: $?"

      - name: Verify event candidates against naturally collected source evidence
        if: success()
        shell: bash
        run: |
          OUT="artifacts/hybrid-search-${{ steps.window.outputs.start }}"
          python scripts/verify_event_candidates.py \
            --matches "$OUT/artist_window_event_matches.csv" \
            --events "$OUT/combined/event_candidates.csv" \
            --inspected "$OUT/combined/event_page_inspection.csv" \
            --primary-sources config/hybrid_venue_sources.csv \
            --secondary-sources config/hybrid_secondary_sources.csv \
            --natural-links "$OUT/combined/event_link_candidates.csv" \
            --out "$OUT/verified_event_candidates.csv"

      - name: Produce source coverage and honest result status
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          out=Path("artifacts/hybrid-search-${{ steps.window.outputs.start }}")
          def rows(path):
              if not path.exists(): return []
              with path.open(encoding="utf-8-sig",newline="") as f: return list(csv.DictReader(f))
          def json_file(path, fallback):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError): return fallback
          primary_audit=rows(out/"primary-discovery/event_discovery_audit.csv")
          secondary_audit=rows(out/"secondary-discovery/event_discovery_audit.csv")
          primary_crawl=rows(out/"primary-inspection/event_page_crawl_audit.csv")
          secondary_crawl=rows(out/"secondary-inspection/event_page_crawl_audit.csv")
          matches=rows(out/"artist_window_event_matches.csv")
          reg_path=out/"known_gig_regressions.summary.json"
          regression=json_file(reg_path, {"fixtures":5,"recovered":0,"naturally_recovered":0,"natural_discovery_status":"NOT_RUN","status":"NOT_RUN"})
          verification=json_file(out/"verified_event_candidates.summary.json", {"candidate_match_rows":len(matches),"verified_match_rows":0,"unverified_candidate_match_rows":len(matches),"verified_events":0,"status":"NOT_RUN"})
          primary_ok=sum(r.get("status")=="fetched_candidates_only" for r in primary_audit)
          secondary_ok=sum(r.get("status")=="fetched_candidates_only" for r in secondary_audit)
          primary_failed=[r.get("venue","") for r in primary_audit if r.get("status")!="fetched_candidates_only"]
          secondary_failed=[r.get("venue","") for r in secondary_audit if r.get("status")!="fetched_candidates_only"]
          caps=[f"primary:{r.get('venue','')}" for r in primary_crawl if str(r.get("crawl_cap_reached","")).casefold() in {"true","1","yes"}]
          caps += [f"secondary:{r.get('venue','')}" for r in secondary_crawl if str(r.get("crawl_cap_reached","")).casefold() in {"true","1","yes"}]
          verified_gigs=int(verification.get("verified_events",0))
          verified_rows=int(verification.get("verified_match_rows",0))
          unverified_rows=int(verification.get("unverified_candidate_match_rows",len(matches)))
          source_coverage_complete=(primary_ok==18 and secondary_ok==18 and not primary_failed and not secondary_failed)
          regression_pass=regression.get("natural_discovery_status")=="PASS" and regression.get("status")=="PASS"
          all_candidates_verified=bool(matches) and unverified_rows==0
          useful=source_coverage_complete and not caps and regression_pass and all_candidates_verified and verified_gigs>0
          status="USEFUL_RESULTS" if useful else "LIMITED_RESULTS"
          reasons=[]
          if primary_failed: reasons.append("Primary source failures: "+", ".join(primary_failed))
          if secondary_failed: reasons.append("Secondary source failures: "+", ".join(secondary_failed))
          if caps: reasons.append("Crawl caps reached: "+", ".join(caps))
          if not regression_pass: reasons.append(f"Natural discovery regression gate is {regression.get('natural_discovery_status','NOT_RUN')} ({regression.get('naturally_recovered',0)}/{regression.get('fixtures',5)} naturally recovered)")
          if unverified_rows: reasons.append(f"{unverified_rows} candidate match rows still require manual verification")
          if verified_gigs==0: reasons.append("No event groups met the verification threshold")
          if not reasons: reasons.append("All current candidate matches passed the verification threshold; source and regression gates passed. The search is bounded and cannot prove absolute calendar completeness.")
          summary={
            "window_start":"${{ steps.window.outputs.start }}",
            "window_end":"${{ steps.window.outputs.end }}",
            "window_days":14,
            "artist_pool_rows":int("${{ steps.window.outputs.pool_rows }}"),
            "venues_expected":18,
            "primary_sources_audited":len(primary_audit),
            "primary_sources_usable":primary_ok,
            "primary_sources_failed_or_unusable":primary_failed,
            "secondary_sources_audited":len(secondary_audit),
            "secondary_sources_usable":secondary_ok,
            "secondary_sources_failed_or_unusable":secondary_failed,
            "event_page_venues_audited":len(primary_crawl)+len(secondary_crawl),
            "event_page_crawl_caps":caps,
            "candidate_pool_matches":len(matches),
            "known_gig_regressions":regression,
            "verification":verification,
            "verified_gigs":verified_gigs,
            "verified_candidate_match_rows":verified_rows,
            "unverified_candidate_match_rows":unverified_rows,
            "status":status,
            "reason":"; ".join(reasons),
            "pool_modified":False
          }
          (out/"run_summary.json").write_text(json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          coverage=[]
          for label,items in (("primary",primary_audit),("secondary",secondary_audit)):
              for r in items:
                  coverage.append({"source_pass":label,"venue":r.get("venue",""),"source_url":r.get("source_url",""),"http_status":r.get("http_status",""),"fetch_status":r.get("status",""),"notes":r.get("notes","")})
          with (out/"venue_coverage.csv").open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=["source_pass","venue","source_url","http_status","fetch_status","notes"])
              w.writeheader();w.writerows(coverage)
          print(json.dumps(summary,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Weekly hybrid Riley & Coe Gig Search\n\n")
              f.write(f"- Window: {summary['window_start']} to {summary['window_end']} (14 days)\n")
              f.write(f"- Artist pool rows: {summary['artist_pool_rows']}\n")
              f.write(f"- Primary sources usable: {primary_ok}/18\n")
              f.write(f"- Secondary sources usable: {secondary_ok}/18\n")
              f.write(f"- Deduplicated candidate artist/event rows: {len(matches)}\n")
              f.write(f"- Known-gig natural regressions: {regression.get('naturally_recovered',0)}/{regression.get('fixtures',5)} ({regression.get('natural_discovery_status','NOT_RUN')})\n")
              f.write(f"- Verified event groups: {verified_gigs}\n")
              f.write(f"- Candidate match rows needing manual review: {unverified_rows}\n")
              f.write(f"- Final status: {status}\n")
              f.write(f"- Status reason: {'; '.join(reasons)}\n")
              if primary_failed: f.write("- Primary source failures: "+", ".join(primary_failed)+"\n")
              if secondary_failed: f.write("- Secondary source failures: "+", ".join(secondary_failed)+"\n")
              if caps: f.write("- Crawl caps reached: "+", ".join(caps)+"\n")
          PY

      - name: Preserve dated report, both source passes, matches and evidence snapshots
        if: steps.window.outputs.start != ''
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-hybrid-gig-search-${{ steps.window.outputs.start }}
          path: artifacts/hybrid-search-${{ steps.window.outputs.start }}/
          if-no-files-found: warn
          retention-days: 90
