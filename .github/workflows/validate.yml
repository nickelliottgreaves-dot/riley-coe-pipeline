name: Riley & Coe evidence validation

# A commit message containing [full-sweep] runs a diagnostic end-to-end collection (including sequential pagination, venue scoping, date-window-aware detail crawling, performer-title fallback and RadioFiles review integration). The episode sources are BBC Sounds and RadioFiles; the collection is fail-closed when tracklist completeness is uncertain.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

# Prevent multiple manual/push test runs from repeatedly crawling the same
# public calendars in parallel; keep the newest run for each ref.
concurrency:
  group: riley-coe-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator and collector regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed artist pool
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("data/artist_pool.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          names = [row["artist"].strip().casefold() for row in rows]
          assert len(rows) == 747, f"Expected 747 seed rows, found {len(rows)}"
          assert len(names) == len(set(names)), "Duplicate normalized artist names in seed pool"
          assert all(row["artist"].strip() and row["status"].strip() for row in rows), "Blank artist/status"
          print(f"Artist pool seed OK: {len(rows)} rows")
          PY

  bbc-sounds-inventory:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory official BBC Riley & Coe episode pages
        run: |
          mkdir -p artifacts/bbc-sounds
          START=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=21)).isoformat())")
          END=$(python -c "from datetime import date; print(date.today().isoformat())")
          python scripts/collect_bbc_sounds.py --start "$START" --end "$END" --out-dir artifacts/bbc-sounds --radiofiles-discovery
      - name: Preserve BBC episode inventory, snapshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-bbc-sounds-inventory-${{ github.run_id }}
          path: artifacts/bbc-sounds/
          if-no-files-found: warn
          retention-days: 30

  radiofiles-inventory:
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [bbc-sounds-inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official BBC episode inventory
        uses: actions/download-artifact@v4
        with:
          name: riley-coe-bbc-sounds-inventory-${{ github.run_id }}
          path: artifacts/bbc-sounds-inventory
      - name: Collect public RadioFiles episode tracklists
        run: |
          mkdir -p artifacts/radiofiles
          SINCE=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=21)).isoformat())")
          UNTIL=$(python -c "from datetime import date; print(date.today().isoformat())")
          python scripts/collect_radiofiles.py --since "$SINCE" --until "$UNTIL" --out-dir artifacts/radiofiles --bbc-inventory artifacts/bbc-sounds-inventory/bbc_episode_inventory.csv
      - name: Reconcile RadioFiles artists against the preserved pool (review only)
        if: always()
        run: |
          if [ -f artifacts/radiofiles/radiofiles_episode_inventory.csv ] && [ -f artifacts/radiofiles/radiofiles_track_candidates.csv ]; then
            python scripts/reconcile_radiofiles_artists.py --pool data/artist_pool.csv --aliases config/artist_aliases.csv --episodes artifacts/radiofiles/radiofiles_episode_inventory.csv --tracks artifacts/radiofiles/radiofiles_track_candidates.csv --out-dir artifacts/radiofiles/reconciliation
          else
            echo "RadioFiles episode/track files unavailable; reconciliation skipped and the collection audit remains the evidence of failure."
          fi
      - name: Cross-check full RadioFiles tracklists against official BBC embedded lists
        if: always()
        run: |
          if [ -f artifacts/bbc-sounds-inventory/bbc_embedded_track_candidates.csv ] && [ -f artifacts/bbc-sounds-inventory/bbc_episode_inventory.csv ] && [ -f artifacts/radiofiles/radiofiles_episode_inventory.csv ] && [ -f artifacts/radiofiles/radiofiles_track_candidates.csv ]; then
            python scripts/verify_radiofiles_against_bbc.py \
              --bbc-tracks artifacts/bbc-sounds-inventory/bbc_embedded_track_candidates.csv \
              --bbc-episodes artifacts/bbc-sounds-inventory/bbc_episode_inventory.csv \
              --radiofiles-tracks artifacts/radiofiles/radiofiles_track_candidates.csv \
              --radiofiles-episodes artifacts/radiofiles/radiofiles_episode_inventory.csv \
              --out-dir artifacts/radiofiles/bbc-crosscheck
          else
            echo "BBC embedded tracklists or RadioFiles rows unavailable; cross-check skipped. Do not promote any artist."
          fi
      - name: Build a dated proposal from exact BBC and RadioFiles matches
        if: always()
        run: |
          if [ -f artifacts/radiofiles/bbc-crosscheck/verified_episode_artist_candidates.csv ]; then
            python scripts/build_verified_artist_pool_proposal.py \
              --pool data/artist_pool.csv \
              --verified-candidates artifacts/radiofiles/bbc-crosscheck/verified_episode_artist_candidates.csv \
              --out-dir artifacts/radiofiles/pool-proposal
          else
            echo "No verified BBC/RadioFiles cross-check file; no pool proposal generated."
          fi
      - name: Preserve RadioFiles tracklists, raw JSON, reconciliation and audit even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-radiofiles-inventory-${{ github.run_id }}
          path: artifacts/radiofiles/
          if-no-files-found: warn
          retention-days: 30

  venue-page-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-sweep]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official venue source pages for discovery
        run: python scripts/collect_venue_pages.py --sources config/venue_sources.csv --out-dir artifacts/venue-pages
      - name: Preserve page text and access audit even when a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-venue-page-inventory-${{ github.run_id }}
          path: artifacts/venue-pages/
          if-no-files-found: warn
          retention-days: 30

  scheduled-evidence-gate:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-sweep]')))
    needs: [assemble-evidence-scaffold]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this run's assembled evidence scaffold
        uses: actions/download-artifact@v4
        with:
          name: riley-coe-evidence-scaffold-${{ github.run_id }}
          path: artifacts/evidence-package
      - name: Validate assembled evidence (must fail closed until complete)
        run: python scripts/validate_run.py --run-dir artifacts/evidence-package --pool data/artist_pool.csv

  event-candidate-discovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-sweep]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover structured events and candidate calendar links
        run: |
          mkdir -p artifacts/event-candidates
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          echo "Window: $START through $END"
          python scripts/discover_event_candidates.py --sources config/venue_sources.csv --start "$START" --end "$END" --out-dir artifacts/event-candidates
      - name: Preserve event candidates and audit even when discovery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-event-candidates-${{ github.run_id }}
          path: artifacts/event-candidates/
          if-no-files-found: warn
          retention-days: 30

  event-page-inspection:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-sweep]')))
    needs: [event-candidate-discovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download event-link candidates
        uses: actions/download-artifact@v4
        with:
          name: riley-coe-event-candidates-${{ github.run_id }}
          path: artifacts/event-candidates
      - name: Inspect event detail pages and bounded same-host links
        run: |
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          python scripts/inspect_event_links.py --links artifacts/event-candidates/event_link_candidates.csv --sources config/venue_sources.csv --out-dir artifacts/event-page-inspection --start "$START" --end "$END" --max-pages-per-venue 120 --max-depth 3
      - name: Preserve event-page snapshots and crawl audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-event-page-inspection-${{ github.run_id }}
          path: artifacts/event-page-inspection/
          if-no-files-found: warn
          retention-days: 30

  assemble-evidence-scaffold:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-sweep]')))
    needs: [bbc-sounds-inventory, radiofiles-inventory, venue-page-inventory, event-candidate-discovery, event-page-inspection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download collector artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: riley-coe-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: false
      - name: Assemble dated PARTIAL evidence package
        run: |
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          python scripts/assemble_run_package.py \
            --start "$START" --end "$END" \
            --bbc-episodes "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_episode_inventory.csv" \
            --bbc-track-candidates "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_track_candidates.csv" \
            --bbc-embedded-track-candidates "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_embedded_track_candidates.csv" \
            --bbc-embedded-tracklist-audit "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_embedded_tracklist_audit.csv" \
            --bbc-radiofiles-episode-crosscheck "artifacts/riley-coe-radiofiles-inventory-${{ github.run_id }}/bbc-crosscheck/bbc_radiofiles_episode_crosscheck.csv" \
            --bbc-radiofiles-verified-candidates "artifacts/riley-coe-radiofiles-inventory-${{ github.run_id }}/bbc-crosscheck/verified_episode_artist_candidates.csv" \
            --radiofiles-episodes "artifacts/riley-coe-radiofiles-inventory-${{ github.run_id }}/radiofiles_episode_inventory.csv" \
            --radiofiles-track-candidates "artifacts/riley-coe-radiofiles-inventory-${{ github.run_id }}/radiofiles_track_candidates.csv" \
            --events "artifacts/riley-coe-event-candidates-${{ github.run_id }}/event_candidates.csv" \
            --venue-audit "artifacts/riley-coe-event-candidates-${{ github.run_id }}/event_discovery_audit.csv" \
            --event-page-inspection "artifacts/riley-coe-event-page-inspection-${{ github.run_id }}/event_page_inspection.csv" \
            --event-page-audit "artifacts/riley-coe-event-page-inspection-${{ github.run_id }}/event_page_crawl_audit.csv" \
            --out-dir artifacts/evidence-package
      - name: Preserve dated evidence scaffold for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-evidence-scaffold-${{ github.run_id }}
          path: artifacts/evidence-package/
          if-no-files-found: warn
          retention-days: 30
