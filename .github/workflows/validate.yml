name: Riley & Coe evidence validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator and collector regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed artist pool
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("data/artist_pool.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          names = [row["artist"].strip().casefold() for row in rows]
          assert len(rows) == 747, f"Expected 747 seed rows, found {len(rows)}"
          assert len(names) == len(set(names)), "Duplicate normalized artist names in seed pool"
          assert all(row["artist"].strip() and row["status"].strip() for row in rows), "Blank artist/status"
          print(f"Artist pool seed OK: {len(rows)} rows")
          PY

  mixcloud-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory recent Mixcloud episodes
        id: collect
        run: |
          mkdir -p artifacts/mixcloud
          SINCE=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=7)).isoformat())")
          UNTIL=$(python -c "from datetime import date; print(date.today().isoformat())")
          echo "Window: $SINCE through $UNTIL"
          python scripts/collect_mixcloud.py --since "$SINCE" --until "$UNTIL" --out-dir artifacts/mixcloud
      - name: Preserve episode inventory and audit even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-mixcloud-inventory-${{ github.run_id }}
          path: artifacts/mixcloud/
          if-no-files-found: warn
          retention-days: 30


  mixcloud-rest-diagnostics:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe documented Mixcloud REST endpoints and comment access
        run: |
          mkdir -p artifacts/mixcloud-diagnostics
          python scripts/diagnose_mixcloud_rest.py --out-dir artifacts/mixcloud-diagnostics
          python scripts/diagnose_mixcloud_html.py --out-dir artifacts/mixcloud-diagnostics
          python scripts/diagnose_mixcloud_graphql.py --out-dir artifacts/mixcloud-diagnostics
      - name: Preserve endpoint diagnostics even when all endpoints fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-mixcloud-rest-diagnostics-${{ github.run_id }}
          path: artifacts/mixcloud-diagnostics/
          if-no-files-found: warn
          retention-days: 30

  mixcloud-browser-diagnostics:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser for public-page diagnostics
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Inspect rendered Mixcloud comments and network requests
        run: |
          mkdir -p artifacts/mixcloud-diagnostics
          python scripts/diagnose_mixcloud_browser.py --out-dir artifacts/mixcloud-diagnostics
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-mixcloud-browser-diagnostics-${{ github.run_id }}
          path: artifacts/mixcloud-diagnostics/
          if-no-files-found: warn
          retention-days: 30


  alternate-tracklist-diagnostics:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser for BBC and RadioFiles diagnostics
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Probe BBC Sounds tracklist expansion and RadioFiles
        run: |
          mkdir -p artifacts/alternate-tracklists
          python scripts/diagnose_alternate_tracklists.py --out-dir artifacts/alternate-tracklists
      - name: Smoke-test RadioFiles JSON collector over the current 14-day archive window
        run: |
          SINCE=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=13)).isoformat())")
          UNTIL=$(python -c "from datetime import date; print(date.today().isoformat())")
          python scripts/collect_radiofiles.py --since "$SINCE" --until "$UNTIL" --out-dir artifacts/alternate-tracklists/radiofiles-smoke
      - name: Compare smoke-test candidates with authoritative pool (review only)
        if: always()
        run: |
          if test -f artifacts/alternate-tracklists/radiofiles-smoke/radiofiles_track_candidates.csv; then
            python scripts/compare_radiofiles_artist_pool.py \
              --pool data/artist_pool.csv \
              --candidates artifacts/alternate-tracklists/radiofiles-smoke/radiofiles_track_candidates.csv \
              --aliases config/artist_aliases.csv \
              --out-dir artifacts/alternate-tracklists/radiofiles-smoke/pool-comparison
          else
            echo "Collector did not produce candidates; comparison intentionally not run."
          fi
      - name: Preserve alternate source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-alternate-tracklist-diagnostics-${{ github.run_id }}
          path: artifacts/alternate-tracklists/
          if-no-files-found: warn
          retention-days: 30


  radiofiles-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect recent RadioFiles episode and tracklist JSON
        run: |
          mkdir -p artifacts/radiofiles
          SINCE=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=13)).isoformat())")
          UNTIL=$(python -c "from datetime import date; print(date.today().isoformat())")
          echo "Window: $SINCE through $UNTIL"
          python scripts/collect_radiofiles.py --since "$SINCE" --until "$UNTIL" --out-dir artifacts/radiofiles
      - name: Compare candidate artists with authoritative pool (review only)
        if: always()
        run: |
          if test -f artifacts/radiofiles/radiofiles_track_candidates.csv; then
            python scripts/compare_radiofiles_artist_pool.py \
              --pool data/artist_pool.csv \
              --candidates artifacts/radiofiles/radiofiles_track_candidates.csv \
              --aliases config/artist_aliases.csv \
              --out-dir artifacts/radiofiles/pool-comparison
          else
            echo "Collector did not produce candidates; comparison intentionally not run."
          fi
      - name: Preserve RadioFiles candidates, snapshots, audit and pool comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-radiofiles-inventory-${{ github.run_id }}
          path: artifacts/radiofiles/
          if-no-files-found: warn
          retention-days: 30

  bbc-sounds-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory official BBC Riley & Coe programme pages and extract tracklist candidates
        run: |
          mkdir -p artifacts/bbc-sounds
          START=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=7)).isoformat())")
          END=$(python -c "from datetime import date; print(date.today().isoformat())")
          python scripts/collect_bbc_sounds.py --start "$START" --end "$END" --out-dir artifacts/bbc-sounds
      - name: Preserve BBC episode inventory, snapshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-bbc-sounds-inventory-${{ github.run_id }}
          path: artifacts/bbc-sounds/
          if-no-files-found: warn
          retention-days: 30

  venue-page-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official venue source pages for discovery
        run: python scripts/collect_venue_pages.py --sources config/venue_sources.csv --out-dir artifacts/venue-pages
      - name: Preserve page text and access audit even when a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-venue-page-inventory-${{ github.run_id }}
          path: artifacts/venue-pages/
          if-no-files-found: warn
          retention-days: 30

  scheduled-evidence-gate:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare'))
    needs: [assemble-evidence-scaffold]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this run's assembled evidence scaffold
        uses: actions/download-artifact@v4
        with:
          name: riley-coe-evidence-scaffold-${{ github.run_id }}
          path: artifacts/evidence-package
      - name: Validate assembled evidence (must fail closed until complete)
        run: python scripts/validate_run.py --run-dir artifacts/evidence-package --pool data/artist_pool.csv

  event-candidate-discovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover structured events and candidate calendar links
        run: |
          mkdir -p artifacts/event-candidates
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          echo "Window: $START through $END"
          python scripts/discover_event_candidates.py --sources config/venue_sources.csv --start "$START" --end "$END" --out-dir artifacts/event-candidates
      - name: Preserve event candidates and audit even when discovery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-event-candidates-${{ github.run_id }}
          path: artifacts/event-candidates/
          if-no-files-found: warn
          retention-days: 30

  event-page-inspection:
    timeout-minutes: 20
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare'))
    needs: [event-candidate-discovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download event-link candidates
        uses: actions/download-artifact@v4
        with:
          name: riley-coe-event-candidates-${{ github.run_id }}
          path: artifacts/event-candidates
      - name: Inspect event detail pages and bounded same-host links
        run: |
          python scripts/inspect_event_links.py --links artifacts/event-candidates/event_link_candidates.csv --sources config/venue_sources.csv --out-dir artifacts/event-page-inspection --max-pages-per-venue 5 --max-depth 2
      - name: Preserve event-page snapshots and crawl audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-event-page-inspection-${{ github.run_id }}
          path: artifacts/event-page-inspection/
          if-no-files-found: warn
          retention-days: 30

  assemble-evidence-scaffold:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/review/radiofiles-pool-compare'))
    needs: [mixcloud-inventory, bbc-sounds-inventory, radiofiles-inventory, venue-page-inventory, event-candidate-discovery, event-page-inspection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download collector artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: riley-coe-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: false
      - name: Assemble dated PARTIAL evidence package
        run: |
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          python scripts/assemble_run_package.py \
            --start "$START" --end "$END" \
            --episodes "artifacts/riley-coe-mixcloud-inventory-${{ github.run_id }}/mixcloud_episode_inventory.csv" \
            --bbc-episodes "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_episode_inventory.csv" \
            --bbc-track-candidates "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_track_candidates.csv" \
            --mixcloud-track-candidates "artifacts/riley-coe-mixcloud-inventory-${{ github.run_id }}/mixcloud_api_track_candidates.csv" \
            --radiofiles-episodes "artifacts/riley-coe-radiofiles-inventory-${{ github.run_id }}/radiofiles_episode_inventory.csv" \
            --radiofiles-track-candidates "artifacts/riley-coe-radiofiles-inventory-${{ github.run_id }}/radiofiles_track_candidates.csv" \
            --events "artifacts/riley-coe-event-candidates-${{ github.run_id }}/event_candidates.csv" \
            --venue-audit "artifacts/riley-coe-event-candidates-${{ github.run_id }}/event_discovery_audit.csv" \
            --event-page-inspection "artifacts/riley-coe-event-page-inspection-${{ github.run_id }}/event_page_inspection.csv" \
            --event-page-audit "artifacts/riley-coe-event-page-inspection-${{ github.run_id }}/event_page_crawl_audit.csv" \
            --out-dir artifacts/evidence-package
      - name: Preserve dated evidence scaffold for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-evidence-scaffold-${{ github.run_id }}
          path: artifacts/evidence-package/
          if-no-files-found: warn
          retention-days: 30
