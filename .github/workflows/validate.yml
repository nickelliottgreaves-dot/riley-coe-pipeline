name: Riley & Coe evidence validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 09:00 UK in winter / 09:00 UTC in summer is not DST-aware; use 08:00 UTC
    # and treat this as a prompt to review, not proof that live research ran.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed artist pool
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("data/artist_pool.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              r = list(csv.DictReader(f))
          names = [x["artist"].strip().casefold() for x in r]
          assert len(r) == 747, f"Expected 747 seed rows, found {len(r)}"
          assert len(names) == len(set(names)), "Duplicate normalized artist names in seed pool"
          assert all(x["artist"].strip() and x["status"].strip() for x in r), "Blank artist/status"
          print(f"Artist pool seed OK: {len(r)} rows")
          PY

  scheduled-evidence-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate latest run evidence (must fail closed)
        run: python scripts/validate_run.py --run-dir data/runs/current --pool data/artist_pool.csv
