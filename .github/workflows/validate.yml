name: Riley & Coe evidence validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator and collector regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed artist pool
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("data/artist_pool.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          names = [row["artist"].strip().casefold() for row in rows]
          assert len(rows) == 747, f"Expected 747 seed rows, found {len(rows)}"
          assert len(names) == len(set(names)), "Duplicate normalized artist names in seed pool"
          assert all(row["artist"].strip() and row["status"].strip() for row in rows), "Blank artist/status"
          print(f"Artist pool seed OK: {len(rows)} rows")
          PY

  mixcloud-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory recent Mixcloud episodes
        id: collect
        run: |
          mkdir -p artifacts/mixcloud
          SINCE=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=7)).isoformat())")
          UNTIL=$(python -c "from datetime import date; print(date.today().isoformat())")
          echo "Window: $SINCE through $UNTIL"
          python scripts/collect_mixcloud.py --since "$SINCE" --until "$UNTIL" --out-dir artifacts/mixcloud
      - name: Preserve episode inventory and audit even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-mixcloud-inventory-${{ github.run_id }}
          path: artifacts/mixcloud/
          if-no-files-found: warn
          retention-days: 30

  bbc-sounds-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory official BBC Riley & Coe episode pages
        run: |
          mkdir -p artifacts/bbc-sounds
          START=$(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=7)).isoformat())")
          END=$(python -c "from datetime import date; print(date.today().isoformat())")
          python scripts/collect_bbc_sounds.py --start "$START" --end "$END" --out-dir artifacts/bbc-sounds
      - name: Preserve BBC episode inventory, snapshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-bbc-sounds-inventory-${{ github.run_id }}
          path: artifacts/bbc-sounds/
          if-no-files-found: warn
          retention-days: 30

  venue-page-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official venue source pages for discovery
        run: python scripts/collect_venue_pages.py --sources config/venue_sources.csv --out-dir artifacts/venue-pages
      - name: Preserve page text and access audit even when a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-venue-page-inventory-${{ github.run_id }}
          path: artifacts/venue-pages/
          if-no-files-found: warn
          retention-days: 30

  scheduled-evidence-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate latest run evidence (must fail closed)
        run: python scripts/validate_run.py --run-dir data/runs/current --pool data/artist_pool.csv

  event-candidate-discovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover structured events and candidate calendar links
        run: |
          mkdir -p artifacts/event-candidates
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          echo "Window: $START through $END"
          python scripts/discover_event_candidates.py --sources config/venue_sources.csv --start "$START" --end "$END" --out-dir artifacts/event-candidates
      - name: Preserve event candidates and audit even when discovery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-event-candidates-${{ github.run_id }}
          path: artifacts/event-candidates/
          if-no-files-found: warn
          retention-days: 30

  assemble-evidence-scaffold:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [mixcloud-inventory, bbc-sounds-inventory, venue-page-inventory, event-candidate-discovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download collector artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: riley-coe-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: false
          if-no-artifact-found: warn
      - name: Assemble dated PARTIAL evidence package
        run: |
          START=$(python -c "from datetime import date; print(date.today().isoformat())")
          END=$(python -c "from datetime import date,timedelta; print((date.today()+timedelta(days=13)).isoformat())")
          python scripts/assemble_run_package.py \
            --start "$START" --end "$END" \
            --episodes "artifacts/riley-coe-mixcloud-inventory-${{ github.run_id }}/mixcloud_episode_inventory.csv" \\
            --bbc-episodes "artifacts/riley-coe-bbc-sounds-inventory-${{ github.run_id }}/bbc_episode_inventory.csv" \\
            --events "artifacts/riley-coe-event-candidates-${{ github.run_id }}/event_candidates.csv" \
            --venue-audit "artifacts/riley-coe-event-candidates-${{ github.run_id }}/event_discovery_audit.csv" \
            --out-dir artifacts/evidence-package
      - name: Preserve dated evidence scaffold for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-evidence-scaffold-${{ github.run_id }}
          path: artifacts/evidence-package/
          if-no-files-found: warn
          retention-days: 30
